name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruefen:
    name: Format, Lints, Tests
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Lints
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Lints der Store-Fassung (ohne Selbst-Update)
        run: cargo clippy -p preset_manager --all-targets --no-default-features -- -D warnings
      - name: Tests
        run: cargo test --workspace

  sicherheit:
    name: Abhängigkeiten auf bekannte Lücken prüfen
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit
      # Ausnahmen mit Begründung: .cargo/audit.toml
      - name: cargo audit
        run: cargo audit
