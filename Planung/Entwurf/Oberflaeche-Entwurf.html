<title>Preset Manager Entwurf</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: Desktop-Werkzeug im Stil der Adobe-Bedienfelder – Kopfleiste, drei Spalten
   (Gruppen · Liste · Details), Hinweisleiste. Bewusst nur dunkel, wie Lightroom/Photoshop. */
:root {
  color-scheme: dark;
  --bg: #1d1d1d;          /* Fenster, Mitte */
  --panel: #252525;       /* Seitenspalten, Kopfleiste */
  --raised: #323232;      /* Felder, Hover */
  --line: #3a3a3a;        /* Trennlinien */
  --text: #e8e8e8;
  --muted: #9a9a9a;
  --faint: #6f6f6f;
  --accent: #2680eb;
  --accent-soft: rgba(38, 128, 235, 0.25);
  --accent-line: rgba(38, 128, 235, 0.7);
  --preset: #2680eb;
  --profile: #9256d9;
  --camera: #12a5a5;
  --warn: #e68619;
  --error: #e34850;
  --ok: #2d9d78;
  --page: #141414;        /* Fläche um das Fenster */
  --font: "Segoe UI Variable Text", "Segoe UI", Inter, system-ui, sans-serif;
  --radius: 4px;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--text);
  font: 12px/1.4 var(--font);
  padding-block: 16px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
svg.i { width: 16px; height: 16px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }

/* ---------- Fenster ---------- */
.app {
  height: 100%; min-height: 560px;
  display: grid; grid-template-rows: auto 1fr auto;
  background: var(--bg);
  border: 1px solid var(--line); border-radius: 8px;
  overflow: hidden; position: relative;
  box-shadow: 0 20px 60px rgba(0,0,0,.45);
}
.topbar {
  display: flex; align-items: center; gap: 12px;
  padding: 8px 12px; background: var(--panel); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13px; white-space: nowrap; }
.brand .mark { width: 22px; height: 22px; border-radius: 5px; background: var(--raised); display: grid; place-items: center; color: var(--accent); }
.search {
  flex: 1; max-width: 380px; display: flex; align-items: center; gap: 6px;
  background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 8px; height: 28px; color: var(--muted);
}
.search input { flex: 1; min-width: 0; background: none; border: 0; outline: none; color: var(--text); height: 100%; }
.search:focus-within { border-color: var(--accent); }
.spacer { flex: 1; }
.chip-btn {
  border: 1px dashed var(--faint); background: none; color: var(--muted); border-radius: 999px;
  padding: 3px 10px; font-size: 11px; white-space: nowrap;
}
.chip-btn:hover { color: var(--text); border-color: var(--muted); }
.btn {
  display: inline-flex; align-items: center; gap: 6px; height: 28px; padding: 0 12px;
  border-radius: var(--radius); border: 1px solid var(--line); background: var(--raised); white-space: nowrap;
}
.btn:hover { border-color: var(--muted); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }
.btn.primary:hover { filter: brightness(1.1); }
.btn.danger { background: transparent; border-color: rgba(227,72,80,.6); color: #ff8a90; }
.btn.danger:hover { background: rgba(227,72,80,.15); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }

.main { display: grid; grid-template-columns: 250px minmax(0, 1fr) 270px; min-height: 0; }
.col { min-height: 0; overflow: auto; }
.left { background: var(--panel); border-right: 1px solid var(--line); padding: 8px 0 16px; }
.right { background: var(--panel); border-left: 1px solid var(--line); padding: 12px; }
.center { display: flex; flex-direction: column; min-width: 0; }

/* ---------- Gruppen links ---------- */
.sec-head {
  display: flex; align-items: center; justify-content: space-between;
  padding: 10px 12px 4px; color: var(--muted); font-size: 11px; font-weight: 600; letter-spacing: .08em;
}
.icon-btn {
  width: 22px; height: 22px; display: grid; place-items: center; border-radius: var(--radius);
  border: 0; background: none; color: var(--muted);
}
.icon-btn:hover { background: var(--raised); color: var(--text); }
.groups { list-style: none; margin: 0; padding: 0 6px; }
.group {
  display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: var(--radius);
  cursor: default; border: 1px solid transparent; user-select: none;
}
.group:hover { background: var(--raised); }
.group.selected { background: var(--accent-soft); }
.group .gname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.group .count { color: var(--muted); font-variant-numeric: tabular-nums; }
.group .origin { color: var(--faint); display: grid; }
.group.pending { border: 1px dashed var(--faint); color: var(--muted); }
.group.drop-ok { border-color: var(--accent); background: var(--accent-soft); }
.group.drop-bad { opacity: .45; }
.group.new-target { display: none; color: var(--accent); border: 1px dashed var(--accent-line); margin-top: 2px; }
body.dragging-items .group.new-target { display: flex; }
.group input.rename { flex: 1; min-width: 0; }
.legend-note { padding: 14px 14px 0; color: var(--faint); font-size: 11px; }

.t-preset { color: var(--preset); }
.t-profile { color: var(--profile); }
.t-camera { color: var(--camera); }
.t-broken { color: var(--warn); }

/* ---------- Mitte ---------- */
.list-head {
  display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
  padding: 10px 16px; border-bottom: 1px solid var(--line);
}
.list-title { font-size: 15px; font-weight: 600; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-sub { color: var(--muted); white-space: nowrap; }
.segmented { margin-left: auto; display: inline-flex; border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.segmented button { border: 0; background: none; padding: 4px 10px; color: var(--muted); display: inline-flex; align-items: center; gap: 5px; }
.segmented button + button { border-left: 1px solid var(--line); }
.segmented button.on { background: var(--raised); color: var(--text); }
.list { flex: 1; overflow: auto; padding: 6px 8px 24px; outline: none; }
.row {
  display: flex; align-items: center; gap: 8px; height: 28px; padding: 0 8px; border-radius: var(--radius);
  user-select: none; position: relative; border: 1px solid transparent;
}
.row:hover { background: var(--raised); }
.row.selected { background: var(--accent-soft); }
.row .grip { color: var(--faint); cursor: grab; display: grid; }
.row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .where { color: var(--muted); max-width: 40%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.row .tag { font-size: 11px; color: var(--warn); }
.row .origin { color: var(--faint); display: grid; }
.row.ins-before::before, .row.ins-after::after {
  content: ""; position: absolute; left: 6px; right: 6px; height: 2px; background: var(--accent); border-radius: 2px;
}
.row.ins-before::before { top: -2px; }
.row.ins-after::after { bottom: -2px; }
.row input.rename { flex: 1; min-width: 0; }
input.rename {
  background: var(--bg); border: 1px solid var(--accent); border-radius: 3px; padding: 2px 6px; outline: none; height: 22px;
}
.empty {
  margin: 24px 16px; border: 1.5px dashed var(--faint); border-radius: 8px; padding: 40px 20px;
  display: grid; justify-items: center; gap: 8px; text-align: center; color: var(--muted);
}
.empty svg.i { width: 32px; height: 32px; color: var(--faint); }
.empty strong { color: var(--text); font-size: 13px; font-weight: 600; }
.empty.drop-ok { border-color: var(--accent); background: var(--accent-soft); color: var(--text); }

/* ---------- Details rechts ---------- */
.d-title { font-size: 11px; font-weight: 600; letter-spacing: .08em; color: var(--muted); margin: 0 0 12px; }
.typebadge { display: flex; align-items: flex-start; gap: 10px; padding: 10px; border-radius: 6px; background: var(--raised); margin-bottom: 14px; }
.typebadge svg.i { width: 22px; height: 22px; }
.typebadge b { display: block; font-size: 13px; }
.typebadge span { color: var(--muted); }
.field { display: grid; gap: 4px; margin-bottom: 12px; }
.field label { color: var(--muted); font-size: 11px; }
.field input, .field select {
  height: 28px; background: var(--bg); border: 1px solid var(--line); border-radius: var(--radius); padding: 0 8px; width: 100%;
}
.field input:focus, .field select:focus { border-color: var(--accent); outline: none; }
.field .err { color: #ff8a90; font-size: 11px; }
.meta { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 6px 10px; margin: 4px 0 14px; color: var(--muted); }
.meta dd { margin: 0; color: var(--text); overflow-wrap: anywhere; font-size: 11px; }
.meta dt { font-size: 11px; }
.mono { font-family: Consolas, "Cascadia Mono", ui-monospace, monospace; }
.stack { display: grid; gap: 8px; }
.typecount { display: flex; gap: 12px; color: var(--muted); margin-bottom: 14px; }
.typecount span { display: inline-flex; align-items: center; gap: 4px; }
.soon { color: var(--faint); font-size: 11px; }

/* ---------- Hinweisleiste ---------- */
.hintbar {
  display: flex; align-items: center; gap: 8px; padding: 6px 12px;
  background: rgba(230, 134, 25, .14); border-top: 1px solid rgba(230,134,25,.4); color: #f2b46c;
}
.hintbar .icon-btn { margin-left: auto; color: #f2b46c; }

/* ---------- Überlagerungen ---------- */
.drop-overlay {
  position: absolute; inset: 0; pointer-events: none; display: none;
  border: 2px solid var(--accent); border-radius: 8px; background: rgba(38,128,235,.10);
  align-items: flex-end; justify-content: center; padding-bottom: 48px; z-index: 30;
}
.drop-overlay.on { display: flex; }
.drop-overlay div { background: var(--accent); color: #fff; padding: 8px 16px; border-radius: 999px; font-weight: 600; }
.drag-tip {
  position: fixed; z-index: 60; pointer-events: none; background: #111; border: 1px solid var(--line);
  color: var(--text); padding: 4px 8px; border-radius: var(--radius); font-size: 11px; display: none; max-width: 260px;
}
.ghost {
  position: fixed; top: -100px; left: -300px; display: inline-flex; align-items: center; gap: 6px;
  background: var(--raised); border: 1px solid var(--accent); color: var(--text); padding: 4px 10px; border-radius: 999px; font-weight: 600;
}
.backdrop { position: absolute; inset: 0; background: rgba(0,0,0,.55); display: grid; place-items: center; z-index: 40; padding: 16px; }
.modal {
  width: min(560px, 100%); max-height: calc(100% - 32px); display: flex; flex-direction: column;
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 20px 60px rgba(0,0,0,.6);
}
.modal header { display: flex; align-items: center; gap: 8px; padding: 14px 16px 6px; font-size: 15px; font-weight: 600; }
.modal header .icon-btn { margin-left: auto; }
.modal .body { padding: 6px 16px 12px; overflow: auto; }
.modal footer { display: flex; align-items: center; gap: 8px; padding: 12px 16px; border-top: 1px solid var(--line); flex-wrap: wrap; }
.modal footer .note { color: var(--muted); margin-right: auto; }
.modal p { margin: 0 0 10px; color: var(--muted); }
.imp-row { display: flex; align-items: center; gap: 8px; height: 30px; padding: 0 6px; border-radius: var(--radius); }
.imp-row:hover { background: var(--raised); }
.imp-row .name { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status { font-size: 11px; padding: 1px 8px; border-radius: 999px; white-space: nowrap; }
.status.new { color: #7fd6b6; background: rgba(45,157,120,.16); }
.status.have { color: var(--muted); background: var(--raised); }
.status.exists { color: #f2b46c; background: rgba(230,134,25,.16); }
.policy { display: grid; gap: 6px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.policy label { display: flex; gap: 8px; align-items: center; }
.del-list { margin: 0 0 4px; padding-left: 18px; }
.del-list li { margin: 2px 0; }
.ctx {
  position: fixed; z-index: 50; min-width: 220px; background: var(--panel); border: 1px solid var(--line);
  border-radius: 6px; padding: 4px; box-shadow: 0 10px 30px rgba(0,0,0,.5);
}
.ctx button {
  display: flex; align-items: center; gap: 8px; width: 100%; border: 0; background: none; padding: 6px 8px;
  border-radius: var(--radius); text-align: left;
}
.ctx button:hover:not([disabled]) { background: var(--accent-soft); }
.ctx button[disabled] { color: var(--faint); cursor: default; }
.ctx kbd { margin-left: auto; color: var(--faint); font: inherit; font-size: 11px; }
.ctx hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
.toasts { position: absolute; right: 16px; bottom: 44px; display: grid; gap: 8px; z-index: 45; }
.toast {
  display: flex; align-items: center; gap: 10px; background: #2b2b2b; border: 1px solid var(--line);
  border-left: 3px solid var(--ok); padding: 8px 10px; border-radius: 6px; box-shadow: 0 8px 24px rgba(0,0,0,.5); max-width: 380px;
}
.toast.error { border-left-color: var(--error); }
.toast button.link { border: 0; background: none; color: #6aa8f2; font-weight: 600; padding: 0; }
.help {
  position: absolute; top: 44px; right: 12px; z-index: 35; width: min(360px, calc(100% - 24px));
  background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; box-shadow: 0 16px 40px rgba(0,0,0,.55);
}
.help h3 { margin: 0 0 8px; font-size: 13px; }
.help ul { margin: 0 0 12px; padding-left: 18px; color: var(--muted); }
.help li { margin: 3px 0; }
.help li b { color: var(--text); font-weight: 600; }
.legend { display: grid; grid-template-columns: auto 1fr; gap: 6px 8px; align-items: center; color: var(--muted); }

@media (max-width: 860px) {
  .main { grid-template-columns: 210px minmax(0, 1fr); }
  .right { display: none; }
}
@media (max-width: 600px) {
  .app { height: auto; }
  .main { grid-template-columns: 1fr; }
  .left { max-height: 240px; border-right: 0; border-bottom: 1px solid var(--line); }
  .center { min-height: 360px; }
  .right { display: block; border-left: 0; border-top: 1px solid var(--line); }
  .brand span { display: none; }
  .topbar { flex-wrap: wrap; }
  .btn.primary span { display: none; }
}
@media (prefers-reduced-motion: no-preference) {
  .toast { animation: rise .14s ease-out; }
  @keyframes rise { from { transform: translateY(6px); opacity: 0; } }
}
</style>

<div class="app" id="app">
  <header class="topbar">
    <div class="brand"><div class="mark" id="brandMark"></div><span>Preset Manager</span></div>
    <label class="search" for="search" title="Suchen (Strg+F)"><span id="searchIco"></span><input id="search" type="search" placeholder="Presets und Profile suchen …" autocomplete="off"></label>
    <div class="spacer"></div>
    <button class="chip-btn" id="helpBtn" type="button">Entwurf · Was kann ich ausprobieren?</button>
    <button class="btn primary" id="importBtn" type="button" title="Strg+Umschalt+I"></button>
  </header>

  <div class="main">
    <nav class="col left" id="left" aria-label="Gruppen"></nav>
    <section class="center">
      <div class="list-head" id="listHead"></div>
      <div class="list" id="list" tabindex="0"></div>
    </section>
    <aside class="col right" id="right" aria-label="Details"></aside>
  </div>

  <div class="hintbar" id="hintbar">
    <span id="hintIco"></span>
    <span>Photoshop läuft – Änderungen erscheinen in Camera Raw nach einem Neustart.</span>
    <button class="icon-btn" id="hintClose" type="button" aria-label="Hinweis schließen"></button>
  </div>

  <div class="drop-overlay" id="dropOverlay"><div id="dropText">Loslassen zum Importieren</div></div>
  <div class="toasts" id="toasts"></div>
</div>
<div class="drag-tip" id="dragTip"></div>
<div class="ghost" id="ghost"></div>

<script>
"use strict";
// ---------------------------------------------------------------------------
// Symbole (schlichte Linien im Stil von Phosphor, selbst gezeichnet)
// ---------------------------------------------------------------------------
const P = {
  preset: '<path d="M4 7h9M17 7h3M4 12h3M11 12h9M4 17h11M19 17h1"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="12" r="2"/><circle cx="17" cy="17" r="2"/>',
  profile: '<circle cx="12" cy="12" r="9"/><path d="M14.5 3.4 9.3 12.3M20.6 9.5H10.3M18.4 17.3 13.3 8.4M9.5 20.6l5.2-8.9M3.4 14.5h10.3M5.6 6.7l5.1 8.9"/>',
  camera: '<path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/>',
  broken: '<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.3"/>',
  legacy: '<path d="M4 12a8 8 0 1 0 2.4-5.7L4 8.5"/><path d="M4 4v4.5h4.5M12 8v4.5l3 2"/>',
  adobe: '<path d="M12 4v10M7.5 10 12 14.5 16.5 10M5 19.5h14"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="m20 20-4.4-4.4"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  trash: '<path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/>',
  pencil: '<path d="M4 20h4L19 9l-4-4L4 16z"/><path d="m13.5 6.5 4 4"/>',
  folder: '<path d="M3 6.5h6l2 2h10V19H3z"/>',
  import: '<path d="M12 3v12M7 10l5 5 5-5"/><path d="M4 15v5h16v-5"/>',
  close: '<path d="M6 6l12 12M18 6 6 18"/>',
  warn: '<path d="M12 3.5 2.5 20h19z"/><path d="M12 10v4.5M12 17.2v.3"/>',
  group: '<path d="M3 6.5h6l2 2h10V19H3z"/><path d="M12 12v4M10 14h4"/>',
  move: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  copy: '<rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V4H4v12h4"/>',
  zip: '<path d="M6 3h9l4 4v14H6z"/><path d="M11 6h2M11 9h2M11 12h2M11 15h2v3h-2z"/>',
  logo: '<rect x="3.5" y="3.5" width="17" height="17" rx="3"/><path d="M7.5 9h5M15.5 9h1M7.5 15h1M11.5 15h5"/><circle cx="14" cy="9" r="1.5"/><circle cx="10" cy="15" r="1.5"/>',
};
const grip = '<svg class="i" viewBox="0 0 24 24" style="stroke:none;fill:currentColor"><circle cx="9" cy="6" r="1.4"/><circle cx="15" cy="6" r="1.4"/><circle cx="9" cy="12" r="1.4"/><circle cx="15" cy="12" r="1.4"/><circle cx="9" cy="18" r="1.4"/><circle cx="15" cy="18" r="1.4"/></svg>';
const ico = (name, cls = "") => `<svg class="i ${cls}" viewBox="0 0 24 24" aria-hidden="true">${P[name]}</svg>`;

const TYPES = {
  preset:  { label: "Preset", plural: "Presets", icon: "preset", cls: "t-preset", where: "Camera Raw: Vorgaben" },
  profile: { label: "Profil", plural: "Profile", icon: "profile", cls: "t-profile", where: "Camera Raw: Bearbeiten → Profil → Durchsuchen" },
  broken:  { label: "Defekt", plural: "Defekt", icon: "broken", cls: "t-broken", where: "Wird von Camera Raw übergangen – Datei ist beschädigt" },
};
const SECTION_OF = { preset: "presets", profile: "profiles", broken: "presets" };
const SECTIONS = [
  { id: "presets", label: "PRESETS", type: "preset" },
  { id: "profiles", label: "PROFILE", type: "profile" },
];

// ---------------------------------------------------------------------------
// Beispieldaten – angelehnt an die Gruppen auf dem Entwicklungsrechner
// ---------------------------------------------------------------------------
let nextId = 1;
const newId = () => "e" + nextId++;
const hex = () => Array.from({ length: 32 }, () => "0123456789ABCDEF"[Math.floor(Math.random() * 16)]).join("");

function makeGroup(section, name, origin, names, type) {
  return {
    id: newId(), section, name, origin, pending: false,
    items: names.map((n) => ({ id: newId(), name: n, type: typeof type === "function" ? type(n) : type, origin, uuid: hex() })),
  };
}
const range = (n, f) => Array.from({ length: n }, (_, i) => f(i + 1));
let groups = [
  makeGroup("presets", "12 Stadtspaziergang Presets", "settings", range(12, (i) => `Stadtspaziergang #${String(i).padStart(3, "0")}`), "preset"),
  makeGroup("presets", "Filmklassiker Kodak-Stil v3.1", "adobe", range(5, (i) => `Filmklassiker Preset ${i}`), "preset"),
  makeGroup("presets", "SOMMERLICHT presets", "adobe", ["Sommerlicht - Black & White Classic", "Sommerlicht - Black & White Soft", "Sommerlicht - Bondi", "Sommerlicht - Brighton", "Sommerlicht - Byron", "Sommerlicht - Cabarita", "Sommerlicht - Hampton", "Sommerlicht - Miami", "Sommerlicht - Sorrento", "Lens correction off", "Lens correction on"], "preset"),
  makeGroup("presets", "Leica Q", "settings", ["Q BW Extreme Process 2012", "Q BW Process 2012", "Q DNG 2012 M9 bw", "Q Extreme 2012", "Q Monochrom alt", "Q Natural", "Q Warm Street", "Q Night"], (n) => (n === "Q Monochrom alt" ? "broken" : "preset")),
  makeGroup("presets", "Reisetagebuch - Nord & Süd - RT LR", "adobe", ["RT 01 - Basis - Hart", "RT 01 - Basis - Weich", "RT 02 - Mittagslicht - Weich", "RT 02 - Mittagslicht - Sehr weich", "RT 03 - Kräftig", "RT 03 - Kräftig - Weich", "RT 04 - Abendessen", "RT 05 - S/W - Hart", "RT 05 - S/W - Weich", "RT 06 - S/W Kräftig"], "preset"),
  makeGroup("profiles", "Filmklassiker Kodak-Stil v3.1", "adobe", range(4, (i) => `Filmklassiker Profil ${i}`), "profile"),
  makeGroup("profiles", "Filmprofile Normal", "adobe", range(14, (i) => `Film Normal ${i}`), "profile"),
  makeGroup("profiles", "Filmprofile Gepusht 1", "adobe", range(6, (i) => `Film Gepusht 1 · ${i}`), "profile"),
  makeGroup("profiles", "Filmprofile Gepusht 2", "adobe", range(6, (i) => `Film Gepusht 2 · ${i}`), "profile"),
];

const state = {
  current: groups[2].id,        // ausgewählte Gruppe
  selection: new Set(),
  anchor: null,
  filter: "all",                // all | presets | profiles
  search: "",
  renaming: null,               // { kind: "item" | "group", id }
  renameError: "",
  drag: null,                   // { kind: "items", ids } | { kind: "group", id }
};
state.selection.add(groups[2].items[2].id);
state.anchor = groups[2].items[2].id;

// ---------------------------------------------------------------------------
// Hilfsfunktionen
// ---------------------------------------------------------------------------
const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s).replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const collator = new Intl.Collator("de", { sensitivity: "base", numeric: true });
const same = (a, b) => a.toLocaleLowerCase("de") === b.toLocaleLowerCase("de");
const groupById = (id) => groups.find((g) => g.id === id);
function findItem(id) {
  for (const g of groups) {
    const index = g.items.findIndex((it) => it.id === id);
    if (index >= 0) return { group: g, item: g.items[index], index };
  }
  return null;
}
const selectedItems = () => [...state.selection].map(findItem).filter(Boolean);
const sortGroups = () => groups.sort((a, b) => (a.section === b.section ? collator.compare(a.name, b.name) : a.section === "presets" ? -1 : 1));
const plural = (n, one, many) => `${n} ${n === 1 ? one : many}`;
function countLabel(items) {
  const p = items.filter((i) => i.type !== "profile").length, q = items.length - p;
  if (q === 0) return plural(p, "Preset", "Presets");
  if (p === 0) return plural(q, "Profil", "Profile");
  return `${plural(p, "Preset", "Presets")}, ${plural(q, "Profil", "Profile")}`;
}
function filePath(group, item) {
  const folder = item.origin === "adobe" ? "ImportedSettings" : "Settings";
  return `%APPDATA%\\Adobe\\CameraRaw\\${folder}\\${group.name}\\${item.name}.xmp`;
}
function snapshot() { return JSON.stringify({ groups, current: state.current }); }
function restore(json) {
  const data = JSON.parse(json);
  groups = data.groups; state.current = data.current; state.selection.clear();
  render();
}
// Camera Raw kennt keine leeren Gruppen: Eine Gruppe ohne Einträge verschwindet,
// außer sie wurde in der App neu angelegt und wartet noch auf Inhalt.
function dropEmptyGroups() {
  groups = groups.filter((g) => g.items.length > 0 || g.pending);
  if (!groupById(state.current)) state.current = visibleGroups()[0]?.id ?? null;
}
const visibleSections = () => SECTIONS.filter((s) => state.filter === "all" || state.filter === s.id);
const visibleGroups = () => groups.filter((g) => visibleSections().some((s) => s.id === g.section));

// ---------------------------------------------------------------------------
// Darstellung
// ---------------------------------------------------------------------------
function render() {
  sortGroups();
  renderLeft();
  renderCenter();
  renderRight();
}

function renderLeft() {
  const html = visibleSections().map((sec) => {
    const rows = groups.filter((g) => g.section === sec.id).map((g) => {
      const t = TYPES[sec.type];
      const name = state.renaming?.kind === "group" && state.renaming.id === g.id
        ? `<input class="rename" id="rename-group" value="${esc(g.name)}" aria-label="Gruppenname">`
        : `<span class="gname" title="${esc(g.name)}">${esc(g.name)}</span>`;
      return `<li class="group ${g.id === state.current && !state.search ? "selected" : ""} ${g.pending ? "pending" : ""}"
        data-group="${g.id}" draggable="${g.pending ? "false" : "true"}" title="${g.pending ? "Neue Gruppe – erscheint in Camera Raw, sobald etwas darin liegt" : ""}">
        ${ico(t.icon, t.cls)}${name}
        ${g.origin === "adobe" ? `<span class="origin" title="Über Adobes Importdialog installiert">${ico("adobe")}</span>` : ""}
        <span class="count">${g.items.length}</span></li>`;
    }).join("");
    return `<div class="sec" data-section="${sec.id}">
      <div class="sec-head"><span>${sec.label}</span>
        <button class="icon-btn" type="button" data-new-group="${sec.id}" title="Neue ${sec.id === "presets" ? "Preset" : "Profil"}-Gruppe">${ico("plus")}</button></div>
      <ul class="groups">${rows}
        <li class="group new-target" data-new-target="${sec.id}">${ico("plus")}<span class="gname">Neue Gruppe</span></li>
      </ul></div>`;
  }).join("");
  $("#left").innerHTML = html + `<p class="legend-note">Gruppen kommen aus den Dateien (crs:Group). Presets und Profile haben getrennte Gruppen – wie in Camera Raw.</p>`;
  const input = $("#rename-group");
  if (input) { input.focus(); input.select(); }
}

function listedItems() {
  if (state.search) {
    const q = state.search.toLocaleLowerCase("de");
    return visibleGroups().flatMap((g) => g.items.filter((it) => it.name.toLocaleLowerCase("de").includes(q)).map((it) => ({ group: g, item: it })));
  }
  const g = groupById(state.current);
  return g ? g.items.map((it) => ({ group: g, item: it })) : [];
}

function renderCenter() {
  const g = groupById(state.current);
  const seg = [["all", "Alle", ""], ["presets", "Presets", "preset"], ["profiles", "Profile", "profile"]]
    .map(([id, label, icon]) => `<button type="button" data-filter="${id}" class="${state.filter === id ? "on" : ""}">${icon ? ico(TYPES[icon].icon, TYPES[icon].cls) : ""}${label}</button>`).join("");
  const rows = listedItems();

      <span class="grip" title="Ziehen zum Verschieben oder Sortieren">${grip}</span>

      ${state.search ? `<span class="where">${esc(group.name)}</span>` : ""}

    </div>`;

  const input = $("#rename-item");
  if (input) { input.focus(); input.select(); }
}

      <div class="stack">

// ---------------------------------------------------------------------------
// Rückmeldungen
// ---------------------------------------------------------------------------
function toast(text, { undo, error } = {}) {
  const el = document.createElement("div");
  el.className = "toast" + (error ? " error" : "");
  el.innerHTML = `<span>${text}</span>${undo ? `<button class="link" type="button">Rückgängig</button>` : ""}`;
  if (undo) el.querySelector("button").onclick = () => { restore(undo); el.remove(); toast("Rückgängig gemacht"); };
  $("#toasts").appendChild(el);
  setTimeout(() => el.remove(), error ? 8000 : 5000);
}

let modalClose = null;
function modal(title, body, footer) {
  closeModal();
  const back = document.createElement("div");
  back.className = "backdrop";
  back.innerHTML = `<div class="modal" role="dialog" aria-modal="true" aria-label="${esc(title)}">
    <header>${title}<button class="icon-btn" type="button" data-close aria-label="Schließen">${ico("close")}</button></header>
    <div class="body">${body}</div><footer>${footer}</footer></div>`;
  back.addEventListener("click", (e) => { if (e.target === back || e.target.closest("[data-close]")) closeModal(); });
  $("#app").appendChild(back);
  modalClose = () => back.remove();
  back.querySelector("footer .primary, footer .danger")?.focus();
  return back;
}
function closeModal() { if (modalClose) { modalClose(); modalClose = null; } }

// ---------------------------------------------------------------------------
// Aktionen
// ---------------------------------------------------------------------------
function selectGroup(id) {
  state.current = id; state.selection.clear(); state.anchor = null; state.search = ""; $("#search").value = "";
  render();
}

function uniqueGroupName(section, base = "Neue Gruppe") {
  let name = base, n = 2;
  while (groups.some((g) => g.section === section && same(g.name, name))) name = `${base} ${n++}`;
  return name;
}

function createGroup(section, items = []) {
  const undo = snapshot();
  const g = { id: newId(), section, name: uniqueGroupName(section), origin: "settings", pending: items.length === 0, items: [] };
  groups.push(g);
  if (items.length) moveItems(items.map((x) => x.id), g.id, { silent: true });
  state.current = g.id;
  state.renaming = { kind: "group", id: g.id };
  if (state.filter !== "all" && state.filter !== section) state.filter = section;
  render();
  if (items.length) toast(`${countLabel(items.map((x) => findItem(x.id).item))} in neue Gruppe verschoben`, { undo });
}

function nameConflict(item, targetGroup) {
  return targetGroup.items.find((x) => x.id !== item.id && same(x.name, item.name));
}

// Prüft, ob Einträge in eine Gruppe dürfen. Gibt eine Begründung zurück oder null.
function moveProblem(ids, target) {
  const entries = ids.map(findItem).filter(Boolean);
  if (!entries.length) return "Nichts ausgewählt";
  const sections = new Set(entries.map(({ item }) => SECTION_OF[item.type]));
  if (sections.size > 1) return "Presets und Profile bitte getrennt verschieben";
  const section = [...sections][0];
  if (section !== target.section) {
    return section === "profiles" ? "Profile gehören in eine Profil-Gruppe – Camera Raw zeigt sie im Profilbrowser" : "Presets gehören in eine Preset-Gruppe";
  }
  if (entries.every(({ group }) => group.id === target.id)) return "Ist schon in dieser Gruppe";
  const clash = entries.find(({ item, group }) => group.id !== target.id && nameConflict(item, target));
  if (clash) return `In „${target.name}“ gibt es schon „${clash.item.name}“`;
  return null;
}

function moveItems(ids, targetId, { silent } = {}) {
  const target = groupById(targetId);
  const undo = snapshot();
  const moving = [];
  for (const id of ids) {
    const found = findItem(id);
    if (!found || found.group.id === targetId) continue;
    found.group.items.splice(found.index, 1);
    moving.push(found.item);
  }
  target.items.push(...moving);
  target.pending = false;
  const currentBefore = state.current;
  dropEmptyGroups();
  // Ist die bisher gezeigte Gruppe leer geworden, zeigt die Liste das Ziel.
  if (!groupById(currentBefore)) state.current = targetId;
  if (!silent) {
    render();
    toast(`${countLabel(moving)} nach „${esc(target.name)}“ verschoben`, { undo });
  }
}

function reorder(ids, beforeId) {
  const g = groupById(state.current);
  const undo = snapshot();
  const moving = g.items.filter((it) => ids.includes(it.id));
  const rest = g.items.filter((it) => !ids.includes(it.id));
  let index = beforeId ? rest.findIndex((it) => it.id === beforeId) : rest.length;
  if (index < 0) index = rest.length;
  rest.splice(index, 0, ...moving);
  g.items = rest;
  render();
  toast(`Reihenfolge geändert – Camera Raw übernimmt sie nach einem Neustart`, { undo });
}

function nudge(direction) {
  const g = groupById(state.current);
  if (!g || state.search || !state.selection.size) return;
  const undo = snapshot();
  const items = g.items;
  const order = direction < 0 ? items.map((_, i) => i) : items.map((_, i) => items.length - 1 - i);
  for (const i of order) {
    const j = i + direction;
    if (state.selection.has(items[i].id) && j >= 0 && j < items.length && !state.selection.has(items[j].id)) {
      [items[i], items[j]] = [items[j], items[i]];
    }
  }
  render();
  toast("Reihenfolge geändert", { undo });
}

function confirmDelete(entries, label) {
  const names = entries.slice(0, 6).map(({ item }) => `<li>${esc(item.name)}</li>`).join("");
  const more = entries.length > 6 ? `<li>… und ${entries.length - 6} weitere</li>` : "";
  const back = modal(`${label} in den Papierkorb legen?`,
    `<p>Die Dateien kommen in den Windows-Papierkorb und lassen sich dort wiederherstellen.</p><ul class="del-list">${names}${more}</ul>`,
    `<span class="note">${countLabel(entries.map((e) => e.item))}</span>
     <button class="btn" type="button" data-close>Abbrechen</button>
     <button class="btn danger" type="button" id="confirmDel">${ico("trash")}In den Papierkorb legen</button>`);
  back.querySelector("#confirmDel").onclick = () => {
    const undo = snapshot();
    const ids = new Set(entries.map((e) => e.item.id));
    for (const g of groups) g.items = g.items.filter((it) => !ids.has(it.id));
    state.selection.clear();
    dropEmptyGroups();
    closeModal();
    render();
    toast(`${countLabel(entries.map((e) => e.item))} in den Papierkorb gelegt`, { undo });
  };
}

function deleteSelection() {
  const entries = selectedItems();
  if (entries.length) confirmDelete(entries, entries.length === 1 ? `„${esc(entries[0].item.name)}“` : `${entries.length} Einträge`);
}

function deleteGroup(g) {
  if (g.pending) {
    groups = groups.filter((x) => x.id !== g.id);
    dropEmptyGroups(); render(); toast(`Leere Gruppe „${esc(g.name)}“ entfernt`);
    return;
  }
  confirmDelete(g.items.map((item) => ({ group: g, item })), `Gruppe „${esc(g.name)}“ mit ${countLabel(g.items)}`);
}

function mergeGroups(sourceId, targetId) {
  const source = groupById(sourceId), target = groupById(targetId);
  const clashes = source.items.filter((it) => nameConflict(it, target));
  const back = modal("Gruppen zusammenführen?",
    `<p>Alle ${countLabel(source.items)} aus „${esc(source.name)}“ kommen nach „${esc(target.name)}“. Die Gruppe „${esc(source.name)}“ verschwindet danach aus Camera Raw.</p>
     ${clashes.length ? `<p style="color:#f2b46c">${plural(clashes.length, "Eintrag hat", "Einträge haben")} denselben Namen wie ein Eintrag in „${esc(target.name)}“ und ${clashes.length === 1 ? "bleibt" : "bleiben"} in „${esc(source.name)}“.</p>` : ""}`,
    `<button class="btn" type="button" data-close>Abbrechen</button>
     <button class="btn primary" type="button" id="confirmMerge">Zusammenführen</button>`);
  back.querySelector("#confirmMerge").onclick = () => {
    const ids = source.items.filter((it) => !nameConflict(it, target)).map((it) => it.id);
    closeModal();
    moveItems(ids, targetId);
    state.current = targetId;
    render();
  };
}

function startRename(kind, id) { state.renaming = { kind, id }; render(); }

function commitRename(value) {
  const r = state.renaming;
  if (!r) return;
  const name = value.trim();
  const undo = snapshot();
  if (r.kind === "item") {
    const found = findItem(r.id);
    if (!found) { state.renaming = null; return render(); }
    if (!name) return toast("Der Name darf nicht leer sein", { error: true });
    if (found.group.items.some((x) => x.id !== r.id && same(x.name, name))) return toast(`In „${esc(found.group.name)}“ gibt es schon „${esc(name)}“`, { error: true });
    const changed = name !== found.item.name;
    found.item.name = name;
    state.renaming = null; render();
    if (changed) toast(`Umbenannt in „${esc(name)}“ – Dateiname wird angepasst`, { undo });
  } else {
    const g = groupById(r.id);
    if (!g) { state.renaming = null; return render(); }
    if (!name) return toast("Der Gruppenname darf nicht leer sein", { error: true });
    if (groups.some((x) => x.id !== g.id && x.section === g.section && x.name === name)) return toast(`Die Gruppe „${esc(name)}“ gibt es schon – zum Zusammenführen die Gruppe darauf ziehen`, { error: true });
    const changed = name !== g.name;
    g.name = name; state.renaming = null; render();
    if (changed && !g.pending) toast(`Gruppe umbenannt – ${countLabel(g.items)} angepasst`, { undo });
  }
}

// ---------------------------------------------------------------------------
// Import (im Entwurf mit Beispielpaket)
// ---------------------------------------------------------------------------
function samplePackage(fileName) {
  const pack = fileName ? fileName.replace(/\.zip$/i, "") : "Herbstlicht Presets";
  const presetGroup = pack, profileGroup = `${pack} Profile`;
  return {
    title: fileName || "Herbstlicht Presets.zip",
    entries: [
      ...["Goldene Stunde", "Nebelmorgen", "Laubwald", "Kupfer", "Erntezeit"].map((n) => ({ name: n, type: "preset", group: presetGroup })),
      { name: "Herbst Film", type: "profile", group: profileGroup },
      { name: "Herbst Film Warm", type: "profile", group: profileGroup },
      { name: "Sommerlicht - Bondi", type: "preset", group: "SOMMERLICHT presets", installedElsewhere: true },
      { name: "Sommerlicht - Byron", type: "preset", group: "SOMMERLICHT presets", installedElsewhere: true },
    ],
  };
}

function openImport(fileName, targetGroupId) {
  const pkg = samplePackage(fileName);
  const target = targetGroupId ? groupById(targetGroupId) : null;
  pkg.entries.forEach((e) => {
    if (target && SECTION_OF[e.type] === target.section) e.group = target.name;
    const existing = groups.find((g) => g.section === SECTION_OF[e.type] && g.name === e.group);
    e.exists = !e.installedElsewhere && !!existing?.items.some((it) => same(it.name, e.name));
    e.checked = !e.installedElsewhere;
  });
  const rows = pkg.entries.map((e, i) => {
    const t = TYPES[e.type];
    const status = e.installedElsewhere
      ? `<span class="status have" title="Dasselbe Preset (gleiche UUID) ist schon installiert. Nochmal installieren würde es in Camera Raw doppelt zeigen.">schon installiert ⓘ</span>`
      : e.exists ? `<span class="status exists" title="In dieser Gruppe gibt es schon eine Datei mit diesem Namen – siehe Regel unten.">Datei vorhanden ⓘ</span>`
      : `<span class="status new">neu</span>`;
    return `<label class="imp-row" for="imp-${i}"><input type="checkbox" id="imp-${i}" data-i="${i}" ${e.checked ? "checked" : ""}>
      ${ico(t.icon, t.cls)}<span class="name">${esc(e.name)}</span><span class="list-sub">${esc(e.group)}</span>${status}</label>`;
  }).join("");
  const dest = target ? `in „${esc(target.name)}“` : "Gruppen aus den Dateien";
  const back = modal(`Presets importieren`,
    `<p>${ico("zip")} <b style="color:var(--text)">${esc(pkg.title)}</b> → ${dest}<br><span class="soon">Im Entwurf wird immer dasselbe Beispielpaket gezeigt.</span></p>
     ${rows}
     <div class="policy" role="radiogroup" aria-label="Wenn eine Datei schon vorhanden ist">
       <span class="list-sub">Wenn eine Datei schon vorhanden ist:</span>
       <label for="pol-skip"><input type="radio" name="pol" id="pol-skip" value="skip" checked> überspringen</label>
       <label for="pol-replace"><input type="radio" name="pol" id="pol-replace" value="replace"> ersetzen (vorher sichern)</label>
       <label for="pol-both"><input type="radio" name="pol" id="pol-both" value="both"> beide behalten</label>
     </div>`,
    `<span class="note" id="impCount"></span>
     <button class="btn" type="button" data-close>Abbrechen</button>
     <button class="btn primary" type="button" id="impGo">Installieren</button>`);
  const update = () => {
    const policy = back.querySelector('input[name="pol"]:checked').value;
    const n = pkg.entries.filter((e) => e.checked && !(e.exists && policy === "skip")).length;
    back.querySelector("#impCount").textContent = `${n} von ${pkg.entries.length} werden installiert`;
    const go = back.querySelector("#impGo");
    go.textContent = n ? `${n} installieren` : "Nichts zu installieren";
    go.disabled = n === 0;
  };
  back.addEventListener("change", (ev) => {
    if (ev.target.dataset.i) pkg.entries[ev.target.dataset.i].checked = ev.target.checked;
    update();
  });
  update();
  back.querySelector("#impGo").onclick = () => {
    const policy = back.querySelector('input[name="pol"]:checked').value;
    const undo = snapshot();
    let installed = 0, landing = null;
    for (const e of pkg.entries) {
      if (!e.checked || (e.exists && policy === "skip")) continue;
      const section = SECTION_OF[e.type];
      let g = groups.find((x) => x.section === section && x.name === e.group);
      if (!g) { g = { id: newId(), section, name: e.group, origin: "settings", pending: false, items: [] }; groups.push(g); }
      let name = e.name;
      if (e.exists && policy === "replace") g.items = g.items.filter((it) => !same(it.name, name));
      if (e.exists && policy === "both") { let n = 2; while (g.items.some((it) => same(it.name, `${e.name} (${n})`))) n++; name = `${e.name} (${n})`; }
      g.items.push({ id: newId(), name, type: e.type, origin: "settings", uuid: hex() });
      g.pending = false;
      installed++;
      landing = landing || g.id;
    }
    closeModal();
    if (landing) { state.current = landing; state.selection.clear(); state.filter = "all"; }
    render();
    toast(`${plural(installed, "Eintrag", "Einträge")} installiert – Photoshop neu starten, damit sie erscheinen`, { undo });
  };
}

let ctxEl = null;
function closeCtx() { ctxEl?.remove(); ctxEl = null; }
function contextMenu(x, y, entries) {
  closeCtx();
  ctxEl = document.createElement("div");
  ctxEl.className = "ctx";
  ctxEl.setAttribute("role", "menu");
  ctxEl.innerHTML = entries.map((e) => e === "-" ? "<hr>"
    : `<button type="button" role="menuitem" ${e.disabled ? "disabled" : ""}>${ico(e.icon)}${e.label}${e.key ? `<kbd>${e.key}</kbd>` : ""}</button>`).join("");
  document.body.appendChild(ctxEl);
  const actions = entries.filter((e) => e !== "-");
  ctxEl.querySelectorAll("button").forEach((b, i) => { b.onclick = () => { closeCtx(); actions[i].run?.(); }; });
  const r = ctxEl.getBoundingClientRect();
  ctxEl.style.left = Math.min(x, innerWidth - r.width - 8) + "px";
  ctxEl.style.top = Math.min(y, innerHeight - r.height - 8) + "px";
  ctxEl.querySelector("button:not([disabled])")?.focus();
}

function setFilter(f) {

$("#list").addEventListener("click", (e) => {
  const row = e.target.closest("[data-item]");
  if (e.target.closest("input")) return;
  if (!row) { if (state.selection.size) { state.selection.clear(); render(); } return; }
  const id = row.dataset.item;
  const ids = listedItems().map((x) => x.item.id);
  if (e.shiftKey && state.anchor && ids.includes(state.anchor)) {
    const [a, b] = [ids.indexOf(state.anchor), ids.indexOf(id)].sort((x, y) => x - y);
    if (!e.ctrlKey && !e.metaKey) state.selection.clear();
    ids.slice(a, b + 1).forEach((x) => state.selection.add(x));
  } else if (e.ctrlKey || e.metaKey) {
    state.selection.has(id) ? state.selection.delete(id) : state.selection.add(id);
    state.anchor = id;
  } else {
    state.selection.clear(); state.selection.add(id); state.anchor = id;
  }
  if (state.search) { const f = findItem(id); if (f) state.current = f.group.id; }
  renderCenter(); renderRight();
  if (state.search) renderLeft();
});
$("#list").addEventListener("dblclick", (e) => {
  const row = e.target.closest("[data-item]");
  if (row && !e.target.closest("input")) startRename("item", row.dataset.item);
});
$("#list").addEventListener("contextmenu", (e) => {
  const row = e.target.closest("[data-item]");
  if (!row) return;
  e.preventDefault();
  if (!state.selection.has(row.dataset.item)) { state.selection.clear(); state.selection.add(row.dataset.item); state.anchor = row.dataset.item; renderCenter(); renderRight(); }
  const sel = selectedItems();
  const oneSection = new Set(sel.map(({ item }) => SECTION_OF[item.type])).size === 1;
  contextMenu(e.clientX, e.clientY, [
    { icon: "pencil", label: "Umbenennen", key: "F2", disabled: sel.length !== 1, run: () => startRename("item", sel[0].item.id) },
    { icon: "group", label: "Neue Gruppe aus Auswahl", key: "Strg+G", disabled: !oneSection, run: () => groupFromSelection() },
    { icon: "copy", label: "Duplizieren (später)", key: "Strg+D", disabled: true },
    { icon: "folder", label: "Im Explorer zeigen", disabled: sel.length !== 1, run: () => toast("Öffnet den Ordner im Explorer und markiert die Datei (im Entwurf ohne Funktion)") },
    "-",
    { icon: "trash", label: sel.length === 1 ? "In den Papierkorb …" : `${sel.length} in den Papierkorb …`, key: "Entf", run: deleteSelection },
  ]);
});

function groupFromSelection() {
  const sel = selectedItems();
  if (!sel.length) return;
  const sections = new Set(sel.map(({ item }) => SECTION_OF[item.type]));
  if (sections.size > 1) return toast("Presets und Profile bitte getrennt gruppieren", { error: true });
  const problem = sel.find(({ item }, i) => sel.some((o, j) => j !== i && same(o.item.name, item.name)));
  if (problem) return toast(`„${esc(problem.item.name)}“ ist doppelt ausgewählt`, { error: true });
  createGroup([...sections][0], sel.map(({ item }) => item));
}

$("#right").addEventListener("click", (e) => {
  const act = e.target.closest("[data-act]")?.dataset.act;
  const g = groupById(state.current);
  if (act === "explorer") toast("Öffnet den Ordner im Explorer und markiert die Datei (im Entwurf ohne Funktion)");
  if (act === "delete") deleteSelection();
  if (act === "group-from-selection") groupFromSelection();
  if (act === "rename-group" && g) startRename("group", g.id);
  if (act === "delete-group" && g) deleteGroup(g);
});
$("#right").addEventListener("change", (e) => {
  if (e.target.id === "d-group" || e.target.id === "d-move") {
    const value = e.target.value;
    const sel = selectedItems();
    if (!value) return;
    if (value === "__new") return groupFromSelection();
    const target = groupById(value);
    const problem = moveProblem(sel.map(({ item }) => item.id), target);
    if (problem && problem !== "Ist schon in dieser Gruppe") { toast(problem, { error: true }); return renderRight(); }
    moveItems(sel.map(({ item }) => item.id), value);
  }
});
$("#right").addEventListener("keydown", (e) => {

  if (sel.length !== 1 || e.target.value.trim() === sel[0].item.name) return;
  state.renaming = { kind: "item", id: sel[0].item.id };

  if (state.renaming) { state.renaming = null; renderRight(); }
});

document.addEventListener("keydown", (e) => {

  if (!input) return;
  if (e.key === "Enter") { e.preventDefault(); commitRename(input.value); }
  if (e.key === "Escape") { e.preventDefault(); const r = state.renaming; state.renaming = null; render(); if (r?.kind === "group") { const g = groupById(r.id); if (g?.pending && !g.items.length) {/* bleibt als leere Gruppe */} } }
}, true);
document.addEventListener("focusout", (e) => {
  const input = e.target.closest?.("input.rename");

// Tastatur
// ---------------------------------------------------------------------------
document.addEventListener("keydown", (e) => {
  const typing = e.target.closest?.("input, select, textarea");
  const ctrl = e.ctrlKey || e.metaKey;
  if (e.key === "Escape") {
    if (ctxEl) return closeCtx();
    if (modalClose) return closeModal();
    if (!$("#help").hidden) return toggleHelp(false);
    if (!typing && state.selection.size) { state.selection.clear(); renderCenter(); renderRight(); }
    return;
  }
  if (ctrl && e.shiftKey && e.key.toLowerCase() === "i") { e.preventDefault(); return openImport(); }
  if (ctrl && e.key.toLowerCase() === "f") { e.preventDefault(); return $("#search").focus(); }
  if (typing || modalClose) return;
  if (ctrl && ["1", "2", "3"].includes(e.key)) { e.preventDefault(); return setFilter(["all", "presets", "profiles"][+e.key - 1]); }
  if (ctrl && e.key.toLowerCase() === "a") {
    e.preventDefault();
    listedItems().forEach(({ item }) => state.selection.add(item.id));
    return (renderCenter(), renderRight());
  }
  if (ctrl && e.key.toLowerCase() === "g") { e.preventDefault(); return groupFromSelection(); }
  if (e.key === "Delete") return deleteSelection();
  if (e.key === "F2") {
    e.preventDefault();
    const sel = selectedItems();
    if (sel.length === 1) return startRename("item", sel[0].item.id);
    if (!sel.length && state.current) return startRename("group", state.current);
  }
  if (e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) { e.preventDefault(); return nudge(e.key === "ArrowUp" ? -1 : 1); }
  if (!e.altKey && (e.key === "ArrowUp" || e.key === "ArrowDown")) {
    const ids = listedItems().map((x) => x.item.id);
    if (!ids.length) return;
    e.preventDefault();
    const at = state.anchor ? ids.indexOf(state.anchor) : -1;
    const next = ids[Math.max(0, Math.min(ids.length - 1, at + (e.key === "ArrowUp" ? -1 : 1)))];
    if (!e.shiftKey) state.selection.clear();
    state.selection.add(next); state.anchor = next;
    renderCenter(); renderRight();
    document.querySelector(`[data-item="${next}"]`)?.scrollIntoView({ block: "nearest" });
  }
});
document.addEventListener("click", (e) => { if (ctxEl && !e.target.closest(".ctx")) closeCtx(); });

const tip = $("#dragTip");
function showTip(text, e) {
  if (!text) { tip.style.display = "none"; return; }
  tip.textContent = text; tip.style.display = "block";
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 270) + "px";
  tip.style.top = e.clientY + 16 + "px";
}
function clearDropMarks() {
  document.querySelectorAll(".drop-ok, .drop-bad, .ins-before, .ins-after").forEach((el) => el.classList.remove("drop-ok", "drop-bad", "ins-before", "ins-after"));
}

$("#list").addEventListener("dragstart", (e) => {
  const row = e.target.closest("[data-item]");
  if (!row) return;
  if (!state.selection.has(row.dataset.item)) { state.selection.clear(); state.selection.add(row.dataset.item); state.anchor = row.dataset.item; renderRight(); row.classList.add("selected"); document.querySelectorAll(".row.selected").forEach((r) => { if (r !== row) r.classList.remove("selected"); }); }
  const items = selectedItems().map((x) => x.item);
  state.drag = { kind: "items", ids: items.map((x) => x.id) };
  const ghost = $("#ghost");
  const first = TYPES[items[0].type];
  ghost.innerHTML = `${ico(first.icon, first.cls)}${countLabel(items)}`;
  e.dataTransfer.setData("text/plain", items.map((x) => x.name).join("\n"));
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setDragImage(ghost, 12, 12);
  document.body.classList.add("dragging-items");
});
$("#left").addEventListener("dragstart", (e) => {
  const li = e.target.closest("[data-group]");
  if (!li) return;
  state.drag = { kind: "group", id: li.dataset.group };
  const g = groupById(li.dataset.group);
  $("#ghost").innerHTML = `${ico("group")}${esc(g.name)}`;
  e.dataTransfer.setData("text/plain", g.name);
  e.dataTransfer.effectAllowed = "move";
  e.dataTransfer.setDragImage($("#ghost"), 12, 12);
});
document.addEventListener("dragend", () => {
  state.drag = null; clearDropMarks(); showTip(null);
  document.body.classList.remove("dragging-items");
});

const isFileDrag = (e) => [...(e.dataTransfer?.types || [])].includes("Files");

// Gültigkeit eines Ziels prüfen; gibt { ok, why, act } zurück.
function evaluateTarget(e) {
  const groupEl = e.target.closest?.("[data-group]");
  const newEl = e.target.closest?.("[data-new-target]");
  const rowEl = e.target.closest?.("[data-item]");
  const emptyEl = e.target.closest?.("#emptyDrop");
  const d = state.drag;
  if (isFileDrag(e)) {
    if (groupEl) {
      const g = groupById(groupEl.dataset.group);
      return { ok: true, el: groupEl, text: `In „${g.name}“ importieren`, act: (ev) => openImport(ev.dataTransfer.files[0]?.name, g.id) };
    }
    return { ok: true, el: null, text: "Loslassen zum Importieren", act: (ev) => openImport(ev.dataTransfer.files[0]?.name) };
  }
  if (!d) return { ok: false };
  if (d.kind === "items") {
    if (groupEl || emptyEl) {
      const g = groupById(groupEl ? groupEl.dataset.group : state.current);
      const why = moveProblem(d.ids, g);
      return why ? { ok: false, el: groupEl || emptyEl, why } : { ok: true, el: groupEl || emptyEl, act: () => moveItems(d.ids, g.id) };
    }
    if (newEl) {
      const items = d.ids.map(findItem);
      const sections = new Set(items.map(({ item }) => SECTION_OF[item.type]));
      if (sections.size > 1) return { ok: false, el: newEl, why: "Presets und Profile bitte getrennt gruppieren" };
      if ([...sections][0] !== newEl.dataset.newTarget) return { ok: false, el: newEl, why: newEl.dataset.newTarget === "presets" ? "Profile gehören in eine Profil-Gruppe" : "Presets gehören in eine Preset-Gruppe" };
      return { ok: true, el: newEl, act: () => createGroup(newEl.dataset.newTarget, items.map((x) => x.item)) };
    }
    if (rowEl && !state.search) {
      const g = groupById(state.current);
      if (!d.ids.every((id) => findItem(id)?.group.id === g.id)) return { ok: false, el: rowEl, why: "Zum Verschieben auf eine Gruppe links ziehen" };
      const r = rowEl.getBoundingClientRect();
      const after = e.clientY > r.top + r.height / 2;
      const rows = [...document.querySelectorAll("#list [data-item]")];
      const before = after ? rows[rows.indexOf(rowEl) + 1]?.dataset.item ?? null : rowEl.dataset.item;
      return { ok: true, el: rowEl, mark: after ? "ins-after" : "ins-before", act: () => reorder(d.ids, before) };
    }
    return { ok: false };
  }
  if (d.kind === "group" && groupEl) {
    const source = groupById(d.id), target = groupById(groupEl.dataset.group);
    if (source.id === target.id) return { ok: false };
    if (source.section !== target.section) return { ok: false, el: groupEl, why: "Preset- und Profil-Gruppen lassen sich nicht zusammenführen" };
    return { ok: true, el: groupEl, text: `Mit „${target.name}“ zusammenführen`, act: () => mergeGroups(source.id, target.id) };
  }
  return { ok: false };
}

let lastTarget = null;
document.addEventListener("dragover", (e) => {
  const result = evaluateTarget(e);
  clearDropMarks();
  if (isFileDrag(e)) {
    $("#dropOverlay").classList.add("on");
    $("#dropText").textContent = result.text;
  }
  if (result.ok) {
    e.preventDefault();
    e.dataTransfer.dropEffect = isFileDrag(e) ? "copy" : "move";
    result.el?.classList.add(result.mark || "drop-ok");
    showTip(isFileDrag(e) ? null : result.text, e);
  } else {
    if (e.dataTransfer) e.dataTransfer.dropEffect = "none";
    if (result.el) { result.el.classList.add("drop-bad"); showTip("⦸ " + result.why, e); } else showTip(null);
  }
  lastTarget = result;
});
document.addEventListener("dragleave", (e) => {
  if (e.clientX <= 0 || e.clientY <= 0 || e.clientX >= innerWidth || e.clientY >= innerHeight) {
    $("#dropOverlay").classList.remove("on"); clearDropMarks(); showTip(null);
  }
});
document.addEventListener("drop", (e) => {
  e.preventDefault();
  const result = evaluateTarget(e);
  $("#dropOverlay").classList.remove("on");
  clearDropMarks(); showTip(null);
  document.body.classList.remove("dragging-items");
  if (result.ok) result.act(e);
  state.drag = null;
});

document.addEventListener("click", (e) => { if (!help.hidden && !e.target.closest("#help, #helpBtn")) toggleHelp(false); });

render();
</script>
